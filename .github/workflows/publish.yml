name: publish

# Publishes to PyPI when you push a version tag (e.g. v0.1.0).
#
# Setup (once): on PyPI, add a Trusted Publisher for this repo —
#   https://pypi.org/manage/account/publishing/
#   owner: anujpatel06   repo: aiquota
#   workflow: publish.yml   environment: pypi
# That uses OIDC, so there's no API token to store or leak.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests before publishing
        env:
          AIQUOTA_NO_AUTODISCOVER: "1"
        run: python -m unittest discover -s tests -v
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
