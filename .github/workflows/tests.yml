name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        env:
          AIQUOTA_NO_AUTODISCOVER: "1"
        run: python -m unittest discover -s tests -v
      - name: Check it installs and runs
        run: |
          pip install -e .
          aiquota --help
          aiquota adapters
