[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiquota"
version = "0.5.1"
description = "See how much of every AI subscription you've used, in one place."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ai", "quota", "usage", "claude", "chatgpt", "subscription", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []          # stdlib only, on purpose

[project.urls]
Homepage = "https://github.com/anujpatel06/aiquota"
Issues = "https://github.com/anujpatel06/aiquota/issues"
Changelog = "https://github.com/anujpatel06/aiquota/blob/main/CHANGELOG.md"

[project.scripts]
aiquota = "aiquota.cli:main"
aiquota-picker = "aiquota.picker:main"
aiquota-remove = "aiquota.remove_ui:main"

[tool.setuptools.packages.find]
include = ["aiquota*"]

[tool.setuptools.package-data]
aiquota = ["assets/*.json", "widgets/*"]
